name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install flet==1.0.4

      - name: Build APK
        run: flet build apk --yes

      - name: Find APK files
        run: |
          echo "Buscando archivos APK en el proyecto..."
          find . -name "*.apk" -type f
          echo "--- Listado de la carpeta build ---"
          ls -la build/ || echo "no existe build"
          ls -la build/apk/ || echo "no existe build/apk"

      - name: Upload APK (búsqueda automática)
        uses: actions/upload-artifact@v4
        with:
          name: fiado-apk
          path: |
            **/*.apk
            build/**/*.apk
          if-no-files-found: warn
          retention-days: 30